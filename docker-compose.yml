services:
  mysql:
    image: mysql:8.4
    container_name: api-weather-mysql
    environment:
      MYSQL_DATABASE: weatherdb
      MYSQL_USER: weather
      MYSQL_PASSWORD: weather
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_weather_data:/var/lib/mysql
    restart: unless-stopped

volumes:
  mysql_weather_data: